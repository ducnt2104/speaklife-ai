services:
  speaklife-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: speaklife-ai:latest
    container_name: speaklife-ai-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - DATABASE_PATH=/app/data/speaklife.db
    volumes:
      # Persist SQLite database directly on host machine
      - ./data:/app/data
